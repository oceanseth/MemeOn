name: Set up pnpm, Node and the workspace
description: >
  The shared preamble of every web-check job: pinned pnpm and Node, the pnpm store from cache, a
  frozen install, the native Rollup binary, and — when asked — Playwright's Chromium from cache.

inputs:
  browsers:
    description: Install Playwright's Chromium (cached by Playwright version) for browser tests.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.25.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22.23.2
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Ensure Linux Rollup binary
      shell: bash
      run: bash .github/scripts/ensure-linux-rollup.sh

    - if: inputs.browsers == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('./web/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
    - if: inputs.browsers == 'true'
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    # Cold cache: download the browser and its OS libraries. Warm cache: the runner image already
    # carries Chrome's shared libraries, so the restored browser launches as is.
    - if: inputs.browsers == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter web exec playwright install --with-deps chromium
