name: Web checks

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'api/**'
      - 'mobile/**'
      - 'shared/**'
      - 'web/**'
      - 'discord/**'
      - '.jscpd.json'
      - '.github/workflows/web-check.yml'
      - '.github/actions/setup/**'
      - '.github/scripts/ensure-linux-rollup.sh'

permissions:
  contents: read

# A new push to the PR supersedes the run in flight.
concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # Stream task output as it happens; turbo's grouped default holds a task's log until it ends,
  # which leaves a hung task with nothing to read.
  TURBO_LOG_ORDER: stream

# The gate is the same set of commands `pnpm run check` runs locally, fanned out so the wall-clock
# is the slowest job (about a minute on a warm cache) rather than the sum. Every job is capped:
# a hang must fail, not sit for GitHub's 6-hour default.
jobs:
  static:
    name: lint:ds · docs · tiers · copy · contrast · tokens · layers · unit · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # the design-system gate first, as in `pnpm run check`: every @shadcn/lint rule is an error,
      # so a restyle, a raw colour or an arbitrary value fails here rather than in review
      - run: pnpm --filter web run lint:ds
      # and the repo's own oxlint rule (lint/memeon.js) tested through that same config
      - run: pnpm --filter web run test:lint-rules
      - run: pnpm --filter web run check-docs
      - run: pnpm --filter web run check-tiers
      - run: pnpm --filter web run check-copy
      - run: pnpm --filter web run check-contrast
      - run: pnpm --filter web run check-tokens
      - run: pnpm --filter web run test:check-docs
      - run: pnpm --filter web run test:check-tiers
      - run: pnpm --filter web run test:check-copy
      - run: pnpm --filter web run test:check-layers
      - run: pnpm --filter web run test:check-contrast
      - run: pnpm --filter web run test:check-tokens
      - run: pnpm --filter web run test:unit
      - run: pnpm --filter memeon-api run test
      - run: pnpm run typecheck

  duplication:
    name: duplicate code (jscpd)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # copy-paste gate: .jscpd.json scopes the scan and fails the run past the duplicated-token
      # threshold it declares
      - run: pnpm run check:dup

  build:
    name: build · proxy routing
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # web#build already runs check-tiers, tsc and check-layers on the emitted CSS
      - run: pnpm run build:web
      # the proxy test reads dist/ from the build above instead of building a second time
      - run: pnpm --filter web exec node scripts/vite-proxy.test.mjs

  mobile:
    name: mobile export
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run mobile:export

  runtime:
    name: runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: 'true'
      - run: pnpm --filter web run test:runtime
