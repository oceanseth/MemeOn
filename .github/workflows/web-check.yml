name: Web checks

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - '.github/workflows/web-check.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ensure Linux Rollup binary
        run: npm install --prefix web --no-save @rollup/rollup-linux-x64-gnu@4.53.2
      - run: npx playwright install --with-deps chromium
      - run: npm run check --prefix web
      - run: npm run build-storybook --prefix web
