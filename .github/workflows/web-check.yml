name: Web checks

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - '.github/workflows/web-check.yml'
      - '.github/scripts/ensure-linux-rollup.sh'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ensure Linux Rollup binary
        shell: bash
        run: bash .github/scripts/ensure-linux-rollup.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run check --prefix web
      - run: npm run build-storybook --prefix web
