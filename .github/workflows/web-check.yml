name: Web checks

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'api/**'
      - 'mobile/**'
      - 'shared/**'
      - 'web/**'
      - '.github/workflows/web-check.yml'
      - '.github/scripts/ensure-linux-rollup.sh'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure Linux Rollup binary
        shell: bash
        run: bash .github/scripts/ensure-linux-rollup.sh
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run mobile:export
      - run: pnpm run build-storybook
